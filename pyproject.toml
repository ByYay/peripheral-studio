[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-peripheral-manager"
version = "0.1.0"
description = "Windows 11 tray app with a 3D interface for Logitech MX Keys Mini, Logitech G733 and SteelSeries Aerox 3 Wireless"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview>=5,<7", "pystray>=0.19,<1", "Pillow>=11,<13"]
hardware = ["rivalcfg==4.17.0", "hidapi==0.15.0"]

[tool.setuptools.packages.find]
include = ["backend*", "desktop*", "automation*", "hardware*"]
